spring:
  application:
    name: api-control-escolar

  # Configuración de base de datos PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/GestionAPI
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Configuración de JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create # Hibernate creará/actualizará las tablas automáticamente
    show-sql: true     # Muestra las consultas SQL en la consola
    properties:
      hibernate:
        format_sql: true # Formatea el SQL impreso para facilitar lectura

server:
  port: 8080